<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopX - Online Shopping</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar">
        <div class="logo">ShopX</div>

        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Search for products...">
            <button onclick="searchProducts()">🔍</button>
        </div>

        <button class="login-btn">Login</button>

        <button class="cart-btn" onclick="openCart()">
            🛒 Cart <span id="cartCount">0</span>
        </button>
    </nav>

    <!-- Categories -->
    <section class="categories">
        <div onclick="filterProducts('All')">🏠<span>All</span></div>
        <div onclick="filterProducts('Mobiles')">📱<span>Mobiles</span></div>
        <div onclick="filterProducts('Electronics')">💻<span>Electronics</span></div>
        <div onclick="filterProducts('Fashion')">👕<span>Fashion</span></div>
        <div onclick="filterProducts('Home')">🏠<span>Home</span></div>
        <div onclick="filterProducts('Books')">📚<span>Books</span></div>
    </section>

    <!-- Hero -->
    <section class="hero">
        <div>
            <h1>Big Deals. Better Prices.</h1>
            <p>Everything you need, all in one place.</p>
            <button onclick="scrollToProducts()">Shop Now →</button>
        </div>
    </section>

    <!-- Products -->
    <main>
        <h2>Best Deals</h2>
        <div class="products" id="productContainer"></div>
    </main>

    <!-- Cart -->
    <div class="cart-panel" id="cartPanel">
        <div class="cart-header">
            <h2>Your Cart</h2>
            <button onclick="closeCart()">✕</button>
        </div>

        <div id="cartItems"></div>

        <div class="cart-total">
            <h3>Total: ₹<span id="cartTotal">0</span></h3>
            <button class="checkout-btn" onclick="checkout()">Checkout</button>
        </div>
    </div>

    <div class="overlay" id="overlay" onclick="closeCart()"></div>

    <!-- Footer -->
    <footer>
        <h2>ShopX</h2>
        <p>© 2026 ShopX. All rights reserved.</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
